<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christophe Florentin — Portfolio créatif</title>
<meta name="description" content="Portfolio de Christophe Florentin, communicant créatif : campagnes d'affichage, films, digital et identités de marque.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..900&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15161b;
    --ink-soft:#3a3b42;
    --paper:#eff1ee;
    --paper-deep:#e2e5df;
    --line:#c9cdc3;
    --cobalt:#263aff;
    --yellow:#f3cc00;
    --font-display:'Bricolage Grotesque','Arial Black',sans-serif;
    --font-body:'Work Sans','Helvetica Neue',Arial,sans-serif;
    --maxw:1240px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--font-body);font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font:inherit;}
  img,svg{display:block;max-width:100%;}
  *:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;}
  /* ---------- Header / Nav ---------- */
  .site-header{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line);}
  .nav{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;position:relative;}
  .nav-logo{font-family:var(--font-display);font-weight:800;font-size:1.05rem;color:var(--ink);text-decoration:none;letter-spacing:-0.01em;}
  .nav-links{display:flex;gap:28px;}
  .nav-links a{font-family:var(--font-body);font-weight:500;font-size:.95rem;color:var(--ink-soft);text-decoration:none;padding:6px 2px;border-bottom:2px solid transparent;}
  .nav-links a:hover,.nav-links a.active{color:var(--ink);border-bottom-color:var(--cobalt);}
  .nav-toggle{display:none;background:none;border:1px solid var(--line);padding:6px 10px;font-size:1.1rem;cursor:pointer;}
  @media(max-width:720px){
    .nav-links{display:none;position:absolute;top:100%;left:0;right:0;background:var(--paper);flex-direction:column;gap:14px;padding:16px 24px;border-bottom:1px solid var(--line);}
    .nav-links.open{display:flex;}
    .nav-toggle{display:block;}
  }
  /* ---------- Generative art tiles (fallback) ---------- */
  .art-tile{position:relative;overflow:hidden;width:100%;background:var(--paper-deep);}
  .art-tile img{width:100%;height:100%;object-fit:cover;display:block;}
  .art-tile .art-letter{font-family:var(--font-display);font-weight:900;line-height:1;font-size:clamp(2.5rem,10vw,6rem);}
  .tpl-split{background:linear-gradient(135deg,var(--c1) 50%,var(--c2) 50%);}
  .tpl-circle{background:var(--c2);}
  .tpl-circle::before{content:"";position:absolute;width:140%;aspect-ratio:1;border-radius:50%;background:var(--c1);top:-35%;right:-35%;}
  .tpl-quad{background:conic-gradient(from 0deg,var(--c1) 0 25%,var(--c2) 0 50%,var(--c1) 0 75%,var(--c2) 0);}
  .tpl-stripe{background:repeating-linear-gradient(45deg,var(--c1) 0 18px,var(--c2) 18px 36px);}
  .tpl-frame{background:var(--c1);}
  .tpl-frame::before{content:"";position:absolute;inset:14%;border:6px solid var(--c2);}
  .tpl-type{background:var(--c1);display:flex;align-items:center;justify-content:center;}
  .tpl-type .art-letter{color:var(--c2);}
  .tpl-grid{background:var(--c2);background-image:radial-gradient(var(--c1) 2px,transparent 2px);background-size:16px 16px;}
  .tpl-grid::after{content:"";position:absolute;width:45%;height:45%;background:var(--c1);bottom:0;right:0;}
  .tpl-arc{background:var(--c2);}
  .tpl-arc::before{content:"";position:absolute;width:90%;aspect-ratio:1;border-radius:50%;background:var(--c1);bottom:-45%;left:-20%;}
  .tpl-arc::after{content:"";position:absolute;width:60%;aspect-ratio:1;border-radius:50%;background:var(--c2);border:6px solid var(--c1);top:10%;right:-10%;}
  /* ---------- Hero slideshow ---------- */
  .hero{position:relative;width:100%;aspect-ratio:21/9;min-height:320px;overflow:hidden;background:var(--ink);}
  @media(max-width:720px){.hero{aspect-ratio:21/9;min-height:140px;}}
  .hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;}
  .hero-slide.active{opacity:1;}
  .hero-slide .art-tile{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;}
  .hero-slide img{width:100%;height:100%;object-fit:cover;}
  .hero-caption{position:absolute;left:24px;bottom:24px;color:#fff;z-index:2;text-shadow:0 2px 14px rgba(0,0,0,.4);}
  .hero-caption p{margin:0 0 4px;font-size:.9rem;}
  .hero-caption h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(1.6rem,4vw,2.6rem);}
  .hero-dots{position:absolute;right:24px;bottom:24px;display:flex;gap:8px;z-index:2;}
  .hero-dots button{width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;background:transparent;padding:0;cursor:pointer;}
  .hero-dots button.active{background:#fff;}
  /* ---------- Sections ---------- */
  .section{max-width:var(--maxw);margin:0 auto;padding:56px 24px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
  .section-head h1{font-family:var(--font-display);font-weight:800;font-size:clamp(1.6rem,3.2vw,2.2rem);margin:0;}
  .section-head p{margin:0;color:var(--ink-soft);font-size:.95rem;}
  /* ---------- Campaign grid ---------- */
  .campaign-grid{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line);border:1px solid var(--line);}
  @media(min-width:640px){.campaign-grid{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:900px){.campaign-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:1200px){.campaign-grid{grid-template-columns:repeat(3,1fr);}}
  .campaign-card{background:var(--paper);text-decoration:none;color:inherit;display:block;}
  .campaign-card .art-tile{transition:transform .35s ease;aspect-ratio:4/3;}
  .campaign-card:hover .art-tile{transform:scale(1.03);}
  .campaign-card .card-meta{padding:12px 14px 16px;}
  .campaign-card .card-meta .num{font-size:.75rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .campaign-card .card-meta h3{margin:4px 0 2px;font-family:var(--font-display);font-weight:700;font-size:1.05rem;}
  .campaign-card .card-meta p{margin:0;font-size:.85rem;color:var(--ink-soft);}
  /* ---------- Detail page ---------- */
  .detail-head{padding:40px 24px 24px;max-width:var(--maxw);margin:0 auto;}
  .back-link{display:inline-block;margin-bottom:20px;font-size:.9rem;color:var(--ink-soft);text-decoration:none;}
  .back-link:hover{color:var(--ink);}
  .detail-head .idx{font-size:.85rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .detail-head h1{font-family:var(--font-display);font-weight:900;font-size:clamp(2.2rem,6vw,4rem);margin:6px 0 4px;letter-spacing:-0.01em;}
  .detail-head .sector{font-size:1rem;color:var(--ink-soft);margin:0 0 20px;}
  .detail-copy{display:grid;gap:16px;max-width:760px;}
  .detail-copy p{margin:0;font-size:1rem;line-height:1.65;}
  /* ---------- Visual Grid — Grille harmonieuse 2-3 colonnes ---------- */
  .visual-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
    gap:20px;
    max-width:var(--maxw);
    margin:32px auto 0;
    padding:0 24px;
    justify-items:center;
    align-items:center;
  }

  @media(min-width:768px){
    .visual-grid{
      grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));
      gap:24px;
      padding:0 32px;
    }
  }

  @media(min-width:1200px){
    .visual-grid{
      grid-template-columns:repeat(3, 1fr);
      gap:28px;
      padding:0 24px;
    }
  }
  /* Visuels qui remplissent leurs cellules */
  .visual-item{
    position:relative;
    overflow:hidden;
    width:100%;
    display:block;
    padding:0;
    background:var(--paper);
    opacity:0;
    transform:translateY(24px);
    transition:opacity .6s ease, transform .6s ease;
  }

  /* Animation au scroll (ajoutée par JS) */
  .visual-item.visible{
    opacity:1;
    transform:translateY(0);
  }

  /* Aspect-ratio adaptables — sans padding */
  .visual-item.portrait{aspect-ratio:2/3;min-height:420px;}
  .visual-item.paysage{aspect-ratio:4/3;min-height:300px;}
  .visual-item.carre{aspect-ratio:1/1;min-height:320px;}
  .visual-item.vedette{aspect-ratio:2/1;min-height:360px;}
  /* Images qui remplissent complètement la cellule intérieure */
  .visual-item img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    display:block;
  }
  /* Mobile — chaque visuel épouse les proportions réelles de son image,
     quelle que soit sa classe (portrait/paysage/carré/vedette) : plus de
     vide dû à un cadre qui ne correspond pas au format réel du fichier */
  @media(max-width:767px){
    .visual-grid .visual-item{aspect-ratio:auto !important;min-height:0 !important;}
    .visual-grid .visual-item img{height:auto !important;object-fit:cover;}
  }
  .rail-section{max-width:var(--maxw);margin:56px auto 0;padding:0 24px 56px;}
  .rail-section h2{font-family:var(--font-display);font-weight:800;font-size:1.3rem;margin:0 0 16px;}
  .rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity;}
  .rail-item{flex:0 0 160px;text-decoration:none;color:inherit;scroll-snap-align:start;}
  .rail-item .art-tile{aspect-ratio:4/3;}
  .rail-item .art-tile img{transition:transform .35s ease;}
  .rail-item:hover .art-tile img{transform:scale(1.12);}
  .rail-item p{margin:8px 0 0;font-size:.85rem;font-weight:600;}
  /* ---------- Lightbox ---------- */
  .lightbox-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    z-index:100;
    opacity:0;
    transition:opacity .3s ease;
  }

  .lightbox-overlay.active{
    display:flex;
    opacity:1;
    align-items:center;
    justify-content:center;
    z-index:1000;
  }

  .lightbox-content{
    position:relative;
    width:90vw;
    height:90vh;
    max-width:1400px;
    max-height:900px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .lightbox-image{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
  }

  .lightbox-close{
    position:absolute;
    top:20px;
    right:20px;
    width:40px;
    height:40px;
    background:none;
    border:none;
    color:#fff;
    font-size:28px;
    cursor:pointer;
    z-index:10;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .lightbox-close:hover{
    color:var(--yellow);
  }

  .lightbox-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:50px;
    height:50px;
    background:rgba(255,255,255,.1);
    border:none;
    color:#fff;
    font-size:24px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .3s ease;
  }

  .lightbox-nav:hover{
    background:rgba(255,255,255,.2);
  }

  .lightbox-prev{
    left:20px;
  }

  .lightbox-next{
    right:20px;
  }

  .lightbox-counter{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    font-size:.9rem;
    background:rgba(0,0,0,.5);
    padding:8px 16px;
    border-radius:4px;
  }
  .visual-item{
    cursor:pointer;
  }
  /* ---------- Profil ---------- */
  .profile-wrap{max-width:var(--maxw);margin:0 auto;padding:48px 24px 64px;display:grid;gap:40px;grid-template-columns:1fr;}
  @media(min-width:900px){.profile-wrap{grid-template-columns:380px 1fr;}}
  .profile-portrait .art-tile{aspect-ratio:3/2;}
  .profile-body h1{font-family:var(--font-display);font-weight:900;font-size:clamp(2rem,5vw,3rem);margin:0 0 4px;}
  .profile-body .role{color:var(--ink-soft);margin:0 0 20px;font-size:1.05rem;}
  .profile-body p.bio{max-width:640px;margin:0 0 32px;line-height:1.7;}
  .profile-columns{display:grid;gap:32px;grid-template-columns:1fr;}
  @media(min-width:640px){.profile-columns{grid-template-columns:1fr 1fr;}}
  .profile-columns h3{font-family:var(--font-display);font-weight:700;font-size:1.05rem;margin:0 0 12px;}
  .profile-columns ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;}
  .profile-columns li{border-bottom:1px solid var(--line);padding-bottom:10px;font-size:.95rem;}
  .profile-columns li .year{color:var(--ink-soft);font-size:.85rem;display:block;margin-bottom:2px;}
  .profile-contact{margin-top:32px;}
  .profile-contact h3{font-family:var(--font-display);font-weight:700;font-size:1.05rem;margin:0 0 12px;}
  .profile-contact p{margin:0 0 6px;font-size:.95rem;color:var(--ink-soft);}
  /* ---------- Contact ---------- */
  .contact-wrap{max-width:var(--maxw);margin:0 auto;padding:48px 24px 64px;display:grid;gap:40px;grid-template-columns:1fr;}
  @media(min-width:900px){.contact-wrap{grid-template-columns:1.1fr .9fr;}}
  .contact-wrap h1{font-family:var(--font-display);font-weight:900;font-size:clamp(2rem,5vw,3.2rem);margin:0 0 16px;}
  .contact-wrap p.lead{max-width:520px;line-height:1.6;margin:0 0 28px;color:var(--ink-soft);}
  .form-field{display:grid;gap:6px;margin-bottom:18px;}
  .form-field label{font-size:.85rem;font-weight:600;}
  .form-field input,.form-field textarea{font-family:var(--font-body);font-size:1rem;padding:10px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:0;}
  .form-field textarea{min-height:120px;resize:vertical;}
  .form-field input:focus,.form-field textarea:focus{outline:2px solid var(--cobalt);outline-offset:1px;border-color:var(--cobalt);}
  .btn{font-family:var(--font-body);font-weight:600;font-size:.95rem;padding:12px 22px;background:var(--ink);color:var(--paper);border:none;cursor:pointer;}
  .btn:hover{background:var(--cobalt);}
  .form-note{font-size:.85rem;color:var(--ink-soft);margin-top:14px;min-height:1.2em;}
  .contact-direct{border-left:1px solid var(--line);padding-left:32px;}
  @media(max-width:899px){.contact-direct{border-left:none;padding-left:0;border-top:1px solid var(--line);padding-top:24px;}}
  .contact-direct h2{font-family:var(--font-display);font-weight:700;font-size:1.1rem;margin:0 0 16px;}
  .contact-direct dl{margin:0;}
  .contact-direct dt{font-size:.8rem;color:var(--ink-soft);margin-top:16px;}
  .contact-direct dt:first-child{margin-top:0;}
  .contact-direct dd{margin:2px 0 0;font-size:1rem;}
  .contact-direct a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);}
  .contact-direct a:hover{border-color:var(--ink);}
  /* ---------- Contact — fond visuel avec transparence (verre dépoli) ---------- */
  .contact-page{
    background-color:var(--ink);
    background-image:linear-gradient(rgba(21,22,27,.15),rgba(21,22,27,.15)), url('images/contact_fond.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  .contact-page .contact-wrap{padding-top:64px;padding-bottom:80px;}
  .contact-page .contact-panel,
  .contact-page .contact-direct{
    background:rgba(21,22,27,.22);
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    border:1px solid rgba(255,255,255,.28);
    border-radius:20px;
    padding:36px;
  }
  .contact-page .contact-wrap h1,
  .contact-page .contact-wrap p.lead,
  .contact-page .form-field label,
  .contact-page .form-note,
  .contact-page .contact-direct h2,
  .contact-page .contact-direct dd{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35);}
  .contact-page .contact-direct dt{color:rgba(255,255,255,.65);}
  .contact-page .contact-direct a{color:#fff;border-bottom-color:rgba(255,255,255,.4);}
  .contact-page .contact-direct a:hover{border-color:#fff;}
  .contact-page .form-field input,
  .contact-page .form-field textarea{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff;}
  .contact-page .form-field input::placeholder,
  .contact-page .form-field textarea::placeholder{color:rgba(255,255,255,.5);}
  /* ---------- Footer ---------- */
  .site-footer{border-top:1px solid var(--line);padding:28px 24px;max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .site-footer p{margin:0;font-size:.85rem;color:var(--ink-soft);}
  .site-footer a{color:var(--ink-soft);font-size:.85rem;text-decoration:none;}
  .site-footer a:hover{color:var(--ink);}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="#/" class="nav-logo">Christophe Florentin</a>
      <div class="nav-links">
        <a href="#/" data-route="home">Mes campagnes</a>
        <a href="#/profil" data-route="profil">Mon profil</a>
        <a href="#/contact" data-route="contact">Me contacter</a>
      </div>
      <button class="nav-toggle" aria-label="Ouvrir le menu" aria-expanded="false">☰</button>
    </nav>
  </header>
  <main id="app"></main>
  <footer class="site-footer">
    <p>Christophe Florentin — conception publicitaire &amp; direction créative.</p>
    <a href="#/contact">Me contacter</a>
  </footer>
  <!-- Lightbox -->
  <div id="lightbox" class="lightbox-overlay">
    <div class="lightbox-content">
      <img id="lightbox-image" class="lightbox-image" src="" alt="">
      <button id="lightbox-close" class="lightbox-close">&times;</button>
      <button id="lightbox-prev" class="lightbox-nav lightbox-prev">‹</button>
      <button id="lightbox-next" class="lightbox-nav lightbox-next">›</button>
      <div id="lightbox-counter" class="lightbox-counter"></div>
    </div>
  </div>

  function plainTitle(t){ return t.replace(/&amp;/g,"&").replace(/&times;/g,"×"); }
  // Rendu des images campagnes avec ratio adapté
  function campaignImageTile(campaignNum, visualNum, ratio){
    var imagePath = "images/campagne_" + campaignNum + "/campagne_" + campaignNum + "_visuel_" + visualNum + ".jpg";
    var ratioClass = ratio || "carre";
    return '<div class="visual-item ' + ratioClass + '"><img src="' + imagePath + '" alt="Campagne ' + campaignNum + ' Visuel ' + visualNum + '"></div>';
  }
  // Rendu des vignettes campagnes pour la page d'accueil et le rail
  function campaignVignetteTile(campaignNum){
    var imagePath = "images/vignettes/campagne_" + campaignNum + "_vignette.jpg";
    return '<div class="art-tile"><img src="' + imagePath + '" alt="Campagne ' + campaignNum + ' vignette"></div>';
  }
  // Rendu slideshow
  function slideShowImageTile(slideNum){
    var imagePath = "images/slideshow/slideshow_" + slideNum + ".jpg";
    return '<div class="art-tile"><img src="' + imagePath + '" alt="Slideshow ' + slideNum + '"></div>';
  }
  var app = document.getElementById("app");
  var navLinks = Array.prototype.slice.call(document.querySelectorAll(".nav-links a"));
  function setActiveNav(route){
    navLinks.forEach(function(a){ a.classList.toggle("active", a.dataset.route === route); });
  }
  // ---------- Lightbox variables & functions ----------
  var lightbox = document.getElementById("lightbox");
  var lightboxImage = document.getElementById("lightbox-image");
  var lightboxClose = document.getElementById("lightbox-close");
  var lightboxPrev = document.getElementById("lightbox-prev");
  var lightboxNext = document.getElementById("lightbox-next");
  var lightboxCounter = document.getElementById("lightbox-counter");
  var currentVisualIndex = 0;
  var allVisuals = [];
  function openLightbox(index, visuals){
    allVisuals = visuals;
    currentVisualIndex = index;
    showLightboxImage();
    lightbox.classList.add("active");
  }
  function closeLightbox(){
    lightbox.classList.remove("active");
  }
  function showLightboxImage(){
    if(allVisuals.length === 0) return;
    var visual = allVisuals[currentVisualIndex];
    lightboxImage.src = visual.src;
    lightboxImage.alt = visual.alt;
    lightboxCounter.textContent = (currentVisualIndex + 1) + " / " + allVisuals.length;
  }
  function nextVisual(){
    currentVisualIndex = (currentVisualIndex + 1) % allVisuals.length;
    showLightboxImage();
  }
  function prevVisual(){
    currentVisualIndex = (currentVisualIndex - 1 + allVisuals.length) % allVisuals.length;
    showLightboxImage();
  }
  lightboxClose.addEventListener("click", closeLightbox);
  lightboxNext.addEventListener("click", nextVisual);
  lightboxPrev.addEventListener("click", prevVisual);
  lightbox.addEventListener("click", function(e){
    if(e.target === lightbox) closeLightbox();
  });
  document.addEventListener("keydown", function(e){
    if(!lightbox.classList.contains("active")) return;
    if(e.key === "Escape") closeLightbox();
    if(e.key === "ArrowRight") nextVisual();
    if(e.key === "ArrowLeft") prevVisual();
  });
  // Fonction pour attacher les listeners lightbox
  function attachLightboxListeners(){
    var visualItems = document.querySelectorAll(".visual-grid .visual-item");
    if(visualItems.length === 0) return;

    var visuals = Array.prototype.map.call(visualItems, function(item, idx){
      var img = item.querySelector("img");
      return {src: img.src, alt: img.alt, index: idx};
    });
    visualItems.forEach(function(item, idx){
      item.addEventListener("click", function(){
        openLightbox(idx, visuals);
      });
    });
  }
  // ---------- Accueil ----------

    var dots = featured.map(function(c, i){
      return '<button class="' + (i === 0 ? 'active' : '') + '" data-dot="' + i + '" aria-label="Voir ' + plainTitle(c.title) + '"></button>';
    }).join("");

    app.innerHTML =

    initHero(featured.length);

  function initHero(count){
    var idx = 0, timer = null;
    var slides = Array.prototype.slice.call(document.querySelectorAll(".hero-slide"));
    var dots = Array.prototype.slice.call(document.querySelectorAll(".hero-dots button"));
    var heroEl = document.querySelector(".hero");
    if(!heroEl) return;
    function show(n){
      idx = (n + count) % count;
      slides.forEach(function(s, i){ s.classList.toggle("active", i === idx); });
      dots.forEach(function(d, i){ d.classList.toggle("active", i === idx); });
    }
    dots.forEach(function(d){
      d.addEventListener("click", function(){ show(parseInt(d.dataset.dot, 10)); restart(); });
    });
    function tick(){ show(idx + 1); }
    function start(){ if(reducedMotion || count < 2) return; timer = setInterval(tick, 5000); }
    function stop(){ if(timer) clearInterval(timer); }
    function restart(){ stop(); start(); }
    heroEl.addEventListener("mouseenter", stop);
    heroEl.addEventListener("mouseleave", start);
    heroEl.addEventListener("focusin", stop);
    heroEl.addEventListener("focusout", start);
    start();
  }
  // ---------- Détail d'une campagne ----------
  function renderCampaign(slug){
    var idx = CAMPAIGNS.findIndex(function(c){ return c.slug === slug; });
    if(idx === -1){
      app.innerHTML = '<section class="section"><p>Campagne introuvable. <a href="#/">Retour à l’accueil</a>.</p></section>';
      return;
    }
    var c = CAMPAIGNS[idx];
    var campNum = idx + 1;
    var visualsHtml = "";

    // Rendu visuels avec leurs ratios respectifs (ADAPTÉ - NON-TRONQUÉ)
    c.visuels.forEach(function(v){
      visualsHtml += campaignImageTile(campNum, v.num, v.ratio);
    });
    var others = CAMPAIGNS.filter(function(x){ return x.slug !== c.slug; });
    var railHtml = others.map(function(o){
      var oCampNum = CAMPAIGNS.findIndex(function(c2){ return c2.slug === o.slug; }) + 1;
      return '<a class="rail-item" href="#/campagne/' + o.slug + '">' + campaignVignetteTile(oCampNum) +
        '<p>' + o.title + '</p><span>' + o.sector + '</span></a>';
    }).join("");
    app.innerHTML =
      '<div class="detail-head">' +
        '<a class="back-link" href="#/">‹ Toutes les campagnes</a>' +
        '<div class="idx">' + String(idx + 1).padStart(2, "0") + ' / ' + CAMPAIGNS.length + '</div>' +
        '<h1>' + c.title + '</h1>' +
        '<p class="sector">' + c.sector + '</p>' +
      '</div>' +
      '<div class="visual-grid">' + visualsHtml + '</div>' +
      '<div class="rail-section">' +
        '<h2>Les autres campagnes du portfolio</h2>' +
        '<div class="rail">' + railHtml + '</div>' +
      '</div>';

    // INTERSECTION OBSERVER — Animations au scroll
    setTimeout(function(){
      var items = Array.prototype.slice.call(document.querySelectorAll(".visual-grid .visual-item"));
      if(!items.length) return;

      var observer = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if(entry.isIntersecting){
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
          }
        });
      }, {threshold:0.1, rootMargin:"0px 0px -50px 0px"});

      items.forEach(function(item){ observer.observe(item); });

      // Attacher les listeners lightbox
      attachLightboxListeners();
    }, 0);
  }

  // ---------- Routeur ----------
  function route(){
    var hash = window.location.hash || "#/";
    var parts = hash.replace(/^#\//, "").split("/").filter(Boolean);
    if(parts[0] === "campagne" && parts[1]){
      renderCampaign(parts[1]);
      setActiveNav("home");
    } else if(parts[0] === "profil"){
      renderProfil();
      setActiveNav("profil");
    } else if(parts[0] === "contact"){
      renderContact();
      setActiveNav("contact");
    } else {
      renderHome();
      setActiveNav("home");
    }
    window.scrollTo(0, 0);
    var links = document.querySelector(".nav-links");
    if(links) links.classList.remove("open");
  }
  var toggle = document.querySelector(".nav-toggle");
  if(toggle){
    toggle.addEventListener("click", function(){
      var links = document.querySelector(".nav-links");
      var open = links.classList.toggle("open");
      toggle.setAttribute("aria-expanded", open);
    });
  }
  window.addEventListener("hashchange", route);
  route();
  // Attacher lightbox après le premier rendu
  setTimeout(attachLightboxListeners, 100);
