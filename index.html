<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christophe Florentin — Portfolio créatif</title>
<meta name="description" content="Portfolio de projets personnels non commandés : concepts publicitaires, visuels de campagnes et déclinaisons en affichage, presse et digital.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --ink:#15161b;
    --ink-soft:#3a3b42;
    --paper:#eff1ee;
    --paper-deep:#e2e5df;
    --line:#c9cdc3;
    --cobalt:#263aff;
    --yellow:#f3cc00;
    --font-display:'Bricolage Grotesque','Arial Black',sans-serif;
    --font-body:'Work Sans','Helvetica Neue',Arial,sans-serif;
    --maxw:1240px;
  }

  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font:inherit;}
  img,svg{display:block;max-width:100%;}
  *:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;}

  /* Header et navigation */
  .site-header{
    position:sticky;
    top:0;
    z-index:50;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .nav{
    max-width:var(--maxw);
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 24px;
    position:relative;
  }
  .nav-logo{
    font-family:var(--font-display);
    font-weight:800;
    font-size:1.05rem;
    color:var(--ink);
    text-decoration:none;
    letter-spacing:-0.01em;
  }
  .nav-links{display:flex;gap:28px;}
  .nav-links a{
    font-family:var(--font-body);
    font-weight:500;
    font-size:.95rem;
    color:var(--ink-soft);
    text-decoration:none;
    padding:6px 2px;
    border-bottom:2px solid transparent;
  }
  .nav-links a:hover,.nav-links a.active{
    color:var(--ink);
    border-bottom-color:var(--cobalt);
  }
  .nav-toggle{
    display:none;
    background:none;
    border:1px solid var(--line);
    padding:6px 10px;
    font-size:1.1rem;
    cursor:pointer;
  }
  @media(max-width:720px){
    .nav-links{
      display:none;
      position:absolute;
      top:100%;
      left:0;
      right:0;
      background:var(--paper);
      flex-direction:column;
      gap:14px;
      padding:16px 24px;
      border-bottom:1px solid var(--line);
    }
    .nav-links.open{display:flex;}
    .nav-toggle{display:block;}
  }

  /* Vignettes */
  .art-tile{
    position:relative;
    overflow:hidden;
    width:100%;
    background:var(--paper-deep);
  }
  .art-tile img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .art-tile .art-letter{
    font-family:var(--font-display);
    font-weight:900;
    line-height:1;
    font-size:clamp(2.5rem,10vw,6rem);
  }
  .tpl-split{background:linear-gradient(135deg,var(--c1) 50%,var(--c2) 50%);}
  .tpl-circle{background:var(--c2);}
  .tpl-circle::before{
    content:"";
    position:absolute;
    width:140%;
    aspect-ratio:1;
    border-radius:50%;
    background:var(--c1);
    top:-35%;
    right:-35%;
  }
  .tpl-quad{
    background:conic-gradient(
      from 0deg,
      var(--c1) 0 25%,
      var(--c2) 0 50%,
      var(--c1) 0 75%,
      var(--c2) 0
    );
  }
  .tpl-stripe{
    background:repeating-linear-gradient(
      45deg,var(--c1) 0 18px,var(--c2) 18px 36px
    );
  }
  .tpl-frame{background:var(--c1);}
  .tpl-frame::before{
    content:"";
    position:absolute;
    inset:14%;
    border:6px solid var(--c2);
  }
  .tpl-type{
    background:var(--c1);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tpl-type .art-letter{color:var(--c2);}
  .tpl-grid{
    background:var(--c2);
    background-image:radial-gradient(var(--c1) 2px,transparent 2px);
    background-size:16px 16px;
  }
  .tpl-grid::after{
    content:"";
    position:absolute;
    width:45%;
    height:45%;
    background:var(--c1);
    bottom:0;
    right:0;
  }
  .tpl-arc{background:var(--c2);}
  .tpl-arc::before{
    content:"";
    position:absolute;
    width:90%;
    aspect-ratio:1;
    border-radius:50%;
    background:var(--c1);
    bottom:-45%;
    left:-20%;
  }
  .tpl-arc::after{
    content:"";
    position:absolute;
    width:60%;
    aspect-ratio:1;
    border-radius:50%;
    background:var(--c2);
    border:6px solid var(--c1);
    top:10%;
    right:-10%;
  }

  /* Diaporama */
  .hero{
    position:relative;
    width:100%;
    aspect-ratio:21/9;
    min-height:320px;
    overflow:hidden;
    background:var(--ink);
  }
  @media(max-width:720px){
    .hero{aspect-ratio:21/9;min-height:140px;}
  }
  .hero-slide{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity .6s ease;
  }
  .hero-slide.active{opacity:1;}
  .hero-slide .art-tile{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    aspect-ratio:auto;
  }
  .hero-slide img{width:100%;height:100%;object-fit:cover;}
  .hero-caption{
    position:absolute;
    left:24px;
    bottom:24px;
    color:#fff;
    z-index:2;
    text-shadow:0 2px 14px rgba(0,0,0,.4);
  }
  .hero-caption p{margin:0 0 4px;font-size:.9rem;}
  .hero-caption h2{
    margin:0;
    font-family:var(--font-display);
    font-weight:800;
    font-size:clamp(1.6rem,4vw,2.6rem);
  }
  .hero-dots{
    position:absolute;
    right:24px;
    bottom:24px;
    display:flex;
    gap:8px;
    z-index:2;
  }
  .hero-dots button{
    width:9px;
    height:9px;
    border-radius:50%;
    border:1.5px solid #fff;
    background:transparent;
    padding:0;
    cursor:pointer;
  }
  .hero-dots button.active{background:#fff;}
  .scroll-hint{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    padding:8px;
    cursor:pointer;
    color:#fff;
    opacity:.9;
    transition:opacity .3s ease;
  }
  .scroll-hint:hover{opacity:1;}
  .scroll-hint.is-hidden{opacity:0;pointer-events:none;}
  .scroll-hint-mouse{
    width:24px;
    height:38px;
    border:2px solid rgba(255,255,255,.85);
    border-radius:14px;
    position:relative;
  }
  .scroll-hint-wheel{
    position:absolute;
    top:6px;
    left:50%;
    transform:translateX(-50%);
    width:4px;
    height:8px;
    border-radius:2px;
    background:#fff;
    animation:scrollHintWheel 1.6s ease-in-out infinite;
  }
  .scroll-hint-label{
    font-size:.7rem;
    letter-spacing:.04em;
    text-transform:uppercase;
    text-shadow:0 1px 6px rgba(0,0,0,.4);
  }
  @keyframes scrollHintWheel{
    0%{opacity:1;top:6px;}
    70%{opacity:0;top:20px;}
    100%{opacity:0;top:6px;}
  }

  /* Sections */
  .section{
    max-width:var(--maxw);
    margin:0 auto;
    padding:56px 24px;
  }
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  .section-head h1{
    font-family:var(--font-display);
    font-weight:800;
    font-size:clamp(1.6rem,3.2vw,2.2rem);
    margin:0;
  }
  .section-head p{margin:0;color:var(--ink-soft);font-size:.95rem;}

  /* Grille des campagnes */
  .campaign-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }
  @media(min-width:640px){
    .campaign-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media(min-width:900px){
    .campaign-grid{grid-template-columns:repeat(3,1fr);}
  }
  @media(min-width:1200px){
    .campaign-grid{grid-template-columns:repeat(3,1fr);}
  }
  .campaign-card{
    background:var(--paper);
    text-decoration:none;
    color:inherit;
    display:block;
  }
  .campaign-card .art-tile{
    transition:transform .35s ease;
    aspect-ratio:4/3;
  }
  .campaign-card:hover .art-tile{transform:scale(1.03);}
  .campaign-card .card-meta{padding:12px 14px 16px;}
  .campaign-card .card-meta .num{
    font-size:.75rem;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .campaign-card .card-meta h3{
    margin:4px 0 2px;
    font-family:var(--font-display);
    font-weight:700;
    font-size:1.05rem;
  }
  .campaign-card .card-meta p{
    margin:0;
    font-size:.85rem;
    color:var(--ink-soft);
  }

  /* Détail d'une campagne */
  .detail-head{
    padding:40px 24px 24px;
    max-width:var(--maxw);
    margin:0 auto;
  }
  .back-link{
    display:inline-block;
    margin-bottom:20px;
    font-size:.9rem;
    color:var(--ink-soft);
    text-decoration:none;
  }
  .back-link:hover{color:var(--ink);}
  .detail-head .idx{
    font-size:.85rem;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .detail-head h1{
    font-family:var(--font-display);
    font-weight:900;
    font-size:clamp(2.2rem,6vw,4rem);
    margin:6px 0 4px;
    letter-spacing:-0.01em;
  }
  .detail-head .sector{
    font-size:1rem;
    color:var(--ink-soft);
    margin:0 0 20px;
  }
  .detail-copy{display:grid;gap:16px;max-width:760px;}
  .detail-copy p{margin:0;font-size:1rem;line-height:1.65;}

  /* Grille des visuels */
  .visual-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
    max-width:var(--maxw);
    margin:32px auto 0;
    padding:0 24px;
    justify-items:center;
    align-items:center;
  }
  @media(min-width:768px){
    .visual-grid{
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:24px;
      padding:0 32px;
    }
  }
  @media(min-width:1200px){
    .visual-grid{
      grid-template-columns:repeat(3,1fr);
      gap:28px;
      padding:0 24px;
    }
  }
  .visual-item{
    position:relative;
    overflow:hidden;
    width:100%;
    display:block;
    padding:0;
    background:var(--paper);
    opacity:0;
    transform:translateY(24px);
    transition:opacity .6s ease,transform .6s ease;
  }
  .visual-item.visible{opacity:1;transform:translateY(0);}
  .visual-item.portrait{aspect-ratio:2/3;min-height:420px;}
  .visual-item.paysage{aspect-ratio:4/3;min-height:300px;}
  .visual-item.carre{aspect-ratio:1/1;min-height:320px;}
  .visual-item.vedette{aspect-ratio:2/1;min-height:360px;}
  .visual-item img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    display:block;
  }
  @media(max-width:767px){
    .visual-grid .visual-item{
      aspect-ratio:auto !important;
      min-height:0 !important;
    }
    .visual-grid .visual-item img{
      height:auto !important;
      object-fit:cover;
    }
  }

  /* Brief créatif autonome — présentation homogène */
  .creative-brief{max-width:var(--maxw);margin:0 auto 10px;padding:0 24px;}
  .creative-brief-inner{max-width:900px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0 16px;}
  .creative-brief h2{font-family:var(--font-display);font-size:1.3rem;font-weight:800;margin:0 0 3px;}
  .portfolio-disclaimer{width:100%;margin:12px 0 0;font-size:.98rem;line-height:1.55;color:var(--ink-soft);}
  .portfolio-disclaimer strong{color:var(--ink);font-weight:700;}
  .creative-brief .brief-disclaimer{font-size:.8rem;color:var(--ink-soft);margin:0 0 10px;}
  .creative-brief dl{margin:0;display:grid;gap:8px;}
  .creative-brief dl div{margin:0;}
  .creative-brief dt{font-weight:800;font-size:.92rem;margin:0 0 1px;}
  .creative-brief dd{margin:0;line-height:1.45;font-size:.95rem;color:var(--ink-soft);}
  @media(max-width:720px){.creative-brief-inner{padding:12px 0 14px;}}

  /* Autres campagnes */
  .rail-section{
    max-width:var(--maxw);
    margin:56px auto 0;
    padding:0 24px 56px;
  }
  .rail-section h2{
    font-family:var(--font-display);
    font-weight:800;
    font-size:1.3rem;
    margin:0 0 16px;
  }
  .rail{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding-bottom:8px;
    scroll-snap-type:x proximity;
  }
  .rail-item{
    flex:0 0 160px;
    text-decoration:none;
    color:inherit;
    scroll-snap-align:start;
  }
  .rail-item .art-tile{aspect-ratio:4/3;}
  .rail-item p{margin:8px 0 0;font-size:.85rem;font-weight:600;}

  /* Lightbox */
  .lightbox-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    z-index:100;
    opacity:0;
    transition:opacity .3s ease;
  }
  .lightbox-overlay.active{
    display:flex;
    opacity:1;
    align-items:center;
    justify-content:center;
    z-index:1000;
  }
  .lightbox-content{
    position:relative;
    width:90vw;
    height:90vh;
    max-width:1400px;
    max-height:900px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .lightbox-image{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
  }
  .lightbox-close{
    position:absolute;
    top:20px;
    right:20px;
    width:40px;
    height:40px;
    background:none;
    border:none;
    color:#fff;
    font-size:28px;
    cursor:pointer;
    z-index:10;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .lightbox-close:hover{color:var(--yellow);}
  .lightbox-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:50px;
    height:50px;
    background:rgba(255,255,255,.1);
    border:none;
    color:#fff;
    font-size:24px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .3s ease;
  }
  .lightbox-nav:hover{background:rgba(255,255,255,.2);}
  .lightbox-prev{left:20px;}
  .lightbox-next{right:20px;}
  .lightbox-counter{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    font-size:.9rem;
    background:rgba(0,0,0,.5);
    padding:8px 16px;
    border-radius:4px;
  }
  .visual-item{cursor:pointer;-webkit-touch-callout:none;}
  .zoom-hint{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:rgba(21,22,27,.72);
    color:#fff;
    font-family:var(--font-body);
    font-size:.65rem;
    font-weight:600;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:14px 18px;
    border-radius:8px;
    box-shadow:0 4px 18px rgba(0,0,0,.25);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:2;
    white-space:nowrap;
  }
  .zoom-hint img{width:22px;height:22px;display:block;}
  .visual-item.hint-visible .zoom-hint{opacity:1;}

  /* Profil */
  .profile-wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:48px 24px 64px;
    display:grid;
    gap:40px;
    grid-template-columns:1fr;
  }
  @media(min-width:900px){
    .profile-wrap{grid-template-columns:380px 1fr;}
  }
  .profile-portrait .art-tile{aspect-ratio:3/2;}
  .profile-body h1{
    font-family:var(--font-display);
    font-weight:900;
    font-size:clamp(2rem,5vw,3rem);
    margin:0 0 4px;
  }
  .profile-body .role{
    color:var(--ink-soft);
    margin:0 0 20px;
    font-size:1.05rem;
  }
  .profile-body p.bio{max-width:640px;margin:0 0 32px;line-height:1.7;}
  .profile-columns{display:grid;gap:32px;grid-template-columns:1fr;}
  @media(min-width:640px){
    .profile-columns{grid-template-columns:1fr 1fr;}
  }
  .profile-columns h3{
    font-family:var(--font-display);
    font-weight:700;
    font-size:1.05rem;
    margin:0 0 12px;
  }
  .profile-columns ul{
    list-style:none;
    margin:0;
    padding:0;
    display:grid;
    gap:10px;
  }
  .profile-columns li{
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
    font-size:.95rem;
  }
  .profile-columns li .year{
    color:var(--ink-soft);
    font-size:.85rem;
    display:block;
    margin-bottom:2px;
  }
  .profile-contact{margin-top:32px;}
  .profile-contact h3{
    font-family:var(--font-display);
    font-weight:700;
    font-size:1.05rem;
    margin:0 0 12px;
  }
  .profile-contact p{
    margin:0 0 6px;
    font-size:.95rem;
    color:var(--ink-soft);
  }

  /* Pied de page */
  .site-footer{
    border-top:1px solid var(--line);
    padding:28px 24px;
    max-width:var(--maxw);
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .site-footer p{margin:0;font-size:.85rem;color:var(--ink-soft);}
  .site-footer a{
    color:var(--ink-soft);
    font-size:.85rem;
    text-decoration:none;
  }
  .site-footer a:hover{color:var(--ink);}
  @media(prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }

  /* Filtres */
  .filter-bar{margin:0 0 24px;}
  .filter-label{margin:0 0 10px;font-size:.85rem;color:var(--ink-soft);}
  .filter-buttons{display:flex;flex-wrap:wrap;gap:8px;}
  .filter-button{
    border:1px solid var(--line);
    border-radius:999px;
    padding:9px 15px;
    background:transparent;
    color:var(--ink-soft);
    font-size:.85rem;
    cursor:pointer;
    min-height:44px;
    transition:background .2s,color .2s,border-color .2s;
  }
  .filter-button:hover{border-color:var(--cobalt);color:var(--cobalt);}
  .filter-button[aria-pressed="true"]{
    background:var(--cobalt);
    border-color:var(--cobalt);
    color:#fff;
  }
  .filter-status{margin:12px 0 0;font-size:.85rem;color:var(--ink-soft);}
  .campaign-card[hidden],.visual-item[hidden]{display:none !important;}
  @media(max-width:720px){
    .filter-buttons{gap:6px;}
    .filter-button{padding:9px 12px;}
  }
</style>
</head>

  ];

  var homeFilter = "all";

  function isFin(c){
    return c.id === "fin" || c.slug === "fin";
  }

  function filterBar(scope){
    var selected = homeFilter;
    var options = FILTERS.slice();

    return '<div class="filter-bar" data-filter-scope="' + scope + '">' +
      '<p class="filter-label">Filtrer par thème</p>' +
      '<div class="filter-buttons" role="group" aria-label="Filtrer les campagnes">' +
      options.map(function(f){
        return '<button type="button" class="filter-button" data-filter="' + f.id +
          '" aria-pressed="' + (selected === f.id) +
          '" aria-controls="campaign-grid">' + f.label + '</button>';
      }).join("") +
      '</div><p class="filter-status" role="status" aria-live="polite"></p></div>';
  }

  function applyFilter(scope,selected){
    var bar = app.querySelector('[data-filter-scope="' + scope + '"]');
    if(!bar) return;

    var count = 0;
    var items = app.querySelectorAll(".campaign-grid .campaign-card");

    items.forEach(function(item){
      var tags = (item.dataset.tags || "").split(" ").filter(Boolean);
      var always = item.dataset.alwaysVisible === "true";
      var matches = selected === "all" || tags.indexOf(selected) !== -1;

      item.hidden = !(always || matches);
      if(matches && !always) count++;
    });

    bar.querySelectorAll("[data-filter]").forEach(function(button){
      button.setAttribute("aria-pressed",String(button.dataset.filter === selected));
    });

    bar.querySelector(".filter-status").textContent =
      count +
      (count === 1 ? " campagne affichée" : " campagnes affichées") +
      " · Plus de pub reste accessible.";
  }

  function initFilters(scope){
    var bar = app.querySelector('[data-filter-scope="' + scope + '"]');
    if(!bar) return;

    bar.addEventListener("click",function(event){
      var button = event.target.closest("[data-filter]");
      if(!button || !bar.contains(button)) return;

      var selected = button.dataset.filter;
      homeFilter = selected;
      applyFilter(scope,selected);
    });

    applyFilter(scope,homeFilter);
  }

  function plainTitle(t){
    return t.replace(/&amp;/g,"&").replace(/&times;/g,"×");

    return '<div class="visual-item ' + ratioClass +
      '" data-tags="' + (tags || []).join(" ") +
      '"><img src="' + imagePath +
      '" alt="Campagne ' + campaignNum + ' Visuel ' + visualNum +
      '"><span class="zoom-hint"><img src="' + ZOOM_ICON +
      '" alt=""><span>Cliquer pour agrandir</span></span></div>';
  }

    return '<div class="art-tile"><img src="' + imagePath +
      '" alt="Campagne ' + campaignNum + ' vignette"></div>';
  }

  var navLinks = Array.prototype.slice.call(
    document.querySelectorAll(".nav-links a")
  );

  function setActiveNav(route){
    navLinks.forEach(function(a){
      a.classList.toggle("active",a.dataset.route === route);
    });
  }

  /* Lightbox */
  var lightbox = document.getElementById("lightbox");
  var lightboxImage = document.getElementById("lightbox-image");
  var lightboxClose = document.getElementById("lightbox-close");
  var lightboxPrev = document.getElementById("lightbox-prev");
  var lightboxNext = document.getElementById("lightbox-next");
  var lightboxCounter = document.getElementById("lightbox-counter");
  var currentVisualIndex = 0;
  var allVisuals = [];

  function openLightbox(index,visuals){
    allVisuals = visuals;
    currentVisualIndex = index;
    showLightboxImage();
    lightbox.classList.add("active");
  }

  function closeLightbox(){
    lightbox.classList.remove("active");
  }

  function showLightboxImage(){
    if(allVisuals.length === 0) return;

    var visual = allVisuals[currentVisualIndex];
    lightboxImage.src = visual.src;
    lightboxImage.alt = visual.alt;
    lightboxCounter.textContent =
      (currentVisualIndex + 1) + " / " + allVisuals.length;
  }

  function nextVisual(){
    currentVisualIndex = (currentVisualIndex + 1) % allVisuals.length;
    showLightboxImage();
  }

  function prevVisual(){
    currentVisualIndex =
      (currentVisualIndex - 1 + allVisuals.length) % allVisuals.length;
    showLightboxImage();
  }

  lightboxClose.addEventListener("click",closeLightbox);
  lightboxNext.addEventListener("click",nextVisual);
  lightboxPrev.addEventListener("click",prevVisual);

  lightbox.addEventListener("click",function(e){
    if(e.target === lightbox) closeLightbox();
  });

  document.addEventListener("keydown",function(e){
    if(!lightbox.classList.contains("active")) return;
    if(e.key === "Escape") closeLightbox();
    if(e.key === "ArrowRight") nextVisual();
    if(e.key === "ArrowLeft") prevVisual();
  });

  function attachLightboxListeners(){
    var visualItems = document.querySelectorAll(".visual-grid .visual-item");
    if(visualItems.length === 0) return;

    visualItems.forEach(function(item){
      if(item.dataset.lightboxBound) return;
      item.dataset.lightboxBound = "true";

      item.addEventListener("click",function(){
        var visibleItems = Array.prototype.filter.call(
          document.querySelectorAll(".visual-grid .visual-item"),
          function(el){return !el.hidden;}
        );

        var visibleVisuals = visibleItems.map(function(el){
          var img = el.querySelector("img");
          return {src:img.src,alt:img.alt};
        });

        var visibleIndex = visibleItems.indexOf(item);
        if(visibleIndex !== -1){
          openLightbox(visibleIndex,visibleVisuals);
        }
      });

      var holdTimer = null;

      function startHold(){
        holdTimer = setTimeout(function(){
          item.classList.add("hint-visible");
        },2000);
      }

      function cancelHold(){
        clearTimeout(holdTimer);
        item.classList.remove("hint-visible");
      }

      item.addEventListener("mouseenter",startHold);
      item.addEventListener("mouseleave",cancelHold);
      item.addEventListener("touchstart",startHold,{passive:true});
      item.addEventListener("touchend",cancelHold);
      item.addEventListener("touchcancel",cancelHold);
    });
  }

  /* Accueil */
  function renderHome(){
    var heroSlides = [
      {num:8,label:"Nespresso"},
      {num:1,label:"La Compagnie du Lit"},
      {num:2,label:"Clovis"},
      {num:3,label:"Banque SG"},
      {num:4,label:"GACI"},
      {num:5,label:"Apple / Inter-Actif"},
      {num:6,label:"Krug"}
    ];

    var slides = heroSlides.map(function(slide,i){
      return '<div class="hero-slide' +
        (i === 0 ? ' active' : '') +
        '" data-slide="' + i + '">' +
        slideShowImageTile(slide.num) +
        '</div>';
    }).join("");

    var dots = heroSlides.map(function(slide,i){
      return '<button class="' + (i === 0 ? 'active' : '') +
        '" data-dot="' + i +
        '" aria-label="Voir ' + plainTitle(slide.label) + '"></button>';
    }).join("");

    var cards = CAMPAIGNS.map(function(c,i){
      var num = String(i + 1).padStart(2,"0");
      var campNum = c.id;

      return '<a class="campaign-card" data-tags="' +
        (c.category || []).join(" ") +
        '" data-always-visible="' + isFin(c) +
        '" href="#/campagne/' + c.slug + '">' +
        campaignVignetteTile(campNum) +
        '<div class="card-meta"><span class="num">' +
        num + ' / ' + CAMPAIGNS.length +
        '</span><h3>' + c.title +
        '</h3><p>' + c.sector + '</p></div></a>';
    }).join("");

    app.innerHTML =
      '<section class="hero" aria-roledescription="carrousel" aria-label="Campagnes à la une">' +
        slides +
        '<div class="hero-dots">' + dots + '</div>' +
        '<button type="button" class="scroll-hint" data-scroll-hint aria-label="Défiler vers le portfolio">' +
          '<span class="scroll-hint-mouse"><span class="scroll-hint-wheel"></span></span>' +
          '<span class="scroll-hint-label">Découvrir</span>' +
        '</button>' +
      '</section>' +
      '<section class="section">' +
        '<div class="section-head">' +
          '<h1>Explorations créatives — imaginaires publicitaires</h1>' +
          '<p class="portfolio-disclaimer"><strong>Projets personnels, non commandés.</strong> Concepts et propositions publicitaires indépendants, sans collaboration ni validation des marques présentées.</p>' +
        '</div>' +
        filterBar("home") +
        '<div id="campaign-grid" class="campaign-grid">' + cards + '</div>' +
      '</section>';

    initFilters("home");
    initHero(heroSlides.length);
  }

  function initHero(count){
    var idx = 0;
    var timer = null;
    var slides = Array.prototype.slice.call(
      document.querySelectorAll(".hero-slide")
    );
    var dots = Array.prototype.slice.call(
      document.querySelectorAll(".hero-dots button")
    );
    var heroEl = document.querySelector(".hero");

    if(!heroEl) return;

    function show(n){
      idx = (n + count) % count;

      slides.forEach(function(s,i){
        s.classList.toggle("active",i === idx);
      });

      dots.forEach(function(d,i){
        d.classList.toggle("active",i === idx);
      });
    }

    dots.forEach(function(d){
      d.addEventListener("click",function(){
        show(parseInt(d.dataset.dot,10));
        restart();
      });
    });

    function tick(){show(idx + 1);}
    function start(){
      if(reducedMotion || count < 2) return;
      timer = setInterval(tick,3000);
    }
    function stop(){
      if(timer) clearInterval(timer);
    }
    function restart(){
      stop();
      start();
    }

    heroEl.addEventListener("mouseenter",stop);
    heroEl.addEventListener("mouseleave",start);
    heroEl.addEventListener("focusin",stop);
    heroEl.addEventListener("focusout",start);

    start();
  }

  /* Détail d'une campagne */
  function renderCampaign(slug){
    var idx = CAMPAIGNS.findIndex(function(c){
      return c.slug === slug;
    });

    if(idx === -1){
      app.innerHTML =
        '<section class="section"><p>Campagne introuvable. ' +
        '<a href="#/">Retour à l’accueil</a>.</p></section>';
      return;
    }

    var c = CAMPAIGNS[idx];
    var campNum = c.id;
    var visualsHtml = "";

    c.visuels.forEach(function(v){
      visualsHtml += campaignImageTile(campNum,v.num,v.ratio,v.tags,v.src);
    });

    var briefData = CREATIVE_BRIEFS[campNum];
    var briefLabels = [
      "Contexte", "Problématique de communication", "Objectif créatif",
      "Parti pris créatif", "Déclinaisons envisagées"
    ];
    function escapeBrief(value){
      return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;")
        .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }
    var briefHtml = briefData && !isFin(c) ?
      '<section class="creative-brief" aria-label="Brief créatif autonome">' +
        '<div class="creative-brief-inner">' +
          '<h2>Brief créatif autonome</h2>' +
          '<p class="brief-disclaimer">Projet personnel, non commandé — proposition créative indépendante, sans collaboration ni validation de la marque.</p>' +
          '<dl>' + briefLabels.map(function(label){
            return '<div><dt>' + escapeBrief(label) + '</dt><dd>' +
              escapeBrief(briefData[label] || "") + '</dd></div>';
          }).join("") + '</dl>' +
        '</div>' +
      '</section>' : "";

    var others = CAMPAIGNS.filter(function(x){
      return x.slug !== c.slug;
    });

    var railHtml = others.map(function(o){
      return '<a class="rail-item" href="#/campagne/' + o.slug + '">' +
        campaignVignetteTile(o.id) +
        '<p>' + o.title + '</p><span>' + o.sector + '</span></a>';
    }).join("");

    app.innerHTML =
      '<div class="detail-head">' +
        '<a class="back-link" href="#/">‹ Toutes les campagnes</a>' +
        '<div class="idx">' +
          String(idx + 1).padStart(2,"0") + ' / ' + CAMPAIGNS.length +
        '</div>' +
        '<h1>' + c.title + '</h1>' +
        '<p class="sector">' + c.sector + '</p>' +
      '</div>' +
      briefHtml +
      '<div id="visual-grid" class="visual-grid">' + visualsHtml + '</div>' +
      '<div class="rail-section">' +
        '<h2>Les autres campagnes du portfolio</h2>' +
        '<div class="rail">' + railHtml + '</div>' +
      '</div>';

    setTimeout(function(){
      var items = Array.prototype.slice.call(
        document.querySelectorAll(".visual-grid .visual-item")
      );

      if(!items.length) return;

      var observer = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if(entry.isIntersecting){
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
          }
        });
      },{
        threshold:0.1,
        rootMargin:"0px 0px -50px 0px"
      });

      items.forEach(function(item){
        observer.observe(item);
      });

      attachLightboxListeners();
    },0);
  }

  /* Profil */
  function renderProfil(){
    app.innerHTML =
      '<div class="profile-wrap">' +
        '<div class="profile-portrait">' +
          '<div class="art-tile" style="aspect-ratio:3/4;">' +
            '<img src="images/profil.jpg" alt="Christophe Florentin">' +
          '</div>' +
        '</div>' +
        '<div class="profile-body">' +
          '<h1>Christophe Florentin</h1>' +
          '<p class="role">Communicant public depuis près de 30 ans</p>' +
          '<p class="bio">Une nouvelle dynamique professionnelle à construire. En agence. Chez l’annonceur. Dans un établissement public. Partout où la communication est attendue forte : installer une image, porter un message, convaincre durablement.</p>' +
          '<div class="profile-columns">' +
            '<div><h3>Expertises</h3><ul>' +
              '<li>Direction créative</li>' +
              '<li>Conception-rédaction</li>' +
              '<li>Identité de marque</li>' +
              '<li>Campagnes 360°</li>' +
            '</ul></div>' +
            '<div><h3>Outils</h3><ul>' +
              '<li>Adobe Illustrator</li>' +
              '<li>Adobe Photoshop</li>' +
              '<li>Adobe Premiere</li>' +
              '<li>Photographie</li>' +
            '</ul></div>' +
          '</div>' +
          '<div class="profile-contact">' +
            '<h3>Coordonnées</h3>' +
            '<p>45 rue des bois, 02190 Villeneuve-sur-Aisne</p>' +
            '<p>Tél : 06 38 58 25 52</p>' +
            '<p>Courriel : christopheflorentin33@gmail.com</p>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /* Routeur */
  function route(){
    var hash = window.location.hash || "#/";
    var parts = hash.replace(/^#\//,"").split("/").filter(Boolean);

    if(parts[0] === "campagne" && parts[1]){
      renderCampaign(parts[1]);
      setActiveNav("home");
    }else if(parts[0] === "profil"){
      renderProfil();
      setActiveNav("profil");
    }else{
      renderHome();
      setActiveNav("home");
    }

    window.scrollTo(0,0);

    var links = document.querySelector(".nav-links");
    if(links) links.classList.remove("open");
  }

  var toggle = document.querySelector(".nav-toggle");

  if(toggle){
    toggle.addEventListener("click",function(){
      var links = document.querySelector(".nav-links");
      var open = links.classList.toggle("open");
      toggle.setAttribute("aria-expanded",open);
    });
  }

  document.addEventListener("click",function(e){
    var hint = e.target.closest("[data-scroll-hint]");
    if(!hint) return;

    var target = document.querySelector(".section") ||
      document.querySelector(".campaign-grid");

    if(target){
      target.scrollIntoView({
        behavior:reducedMotion ? "auto" : "smooth",
        block:"start"
      });
    }
  });

  window.addEventListener("scroll",function(){
    var hint = document.querySelector(".scroll-hint");
    if(!hint) return;

    hint.classList.toggle("is-hidden",window.scrollY > 40);
  },{passive:true});

  window.addEventListener("hashchange",route);
  route();
  setTimeout(attachLightboxListeners,100);
})();
</script>

<script>
/* Limiter le clic droit et le déplacement aux images publicitaires. */
(function(){
  "use strict";
  var advertisingImages = [
    ".hero-slide .art-tile img",
    ".campaign-card .art-tile img",
    ".visual-grid .visual-item > img",
    ".rail-item .art-tile img",
    "#lightbox-image"
  ].join(",");

  function preventImageAction(event){
    if(event.target instanceof Element && event.target.matches(advertisingImages)){
      event.preventDefault();
    }
  }

  document.addEventListener("contextmenu",preventImageAction);
  document.addEventListener("dragstart",preventImageAction);
})();
</script>
